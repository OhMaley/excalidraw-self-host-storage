openapi: 3.2.0
info:
  title: Excalidraw Self Host Storage API
  version: 0.1.0
paths:
  /workspaces/{workspaceId}/collections/{collectionId}/drawings:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/CollectionId'
    get:
      operationId: listDrawings
      summary: List drawings in a collection.
      tags:
        - Drawings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Drawing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createDrawing
      summary: Create a drawing in a collection.
      tags:
        - Drawings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Homepage wireframe
                description:
                  type:
                    - string
                    - 'null'
                  maxLength: 500
                  example: Post-standup sketch
                tags:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                  maxItems: 20
                  example:
                    - wireframe
                    - homepage
      responses:
        '201':
          description: Drawing created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drawing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspaceId}/collections/{collectionId}/drawings/{drawingId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/CollectionId'
      - $ref: '#/components/parameters/DrawingId'
    get:
      operationId: getDrawing
      summary: Fetch a drawing's metadata.
      tags:
        - Drawings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drawing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateDrawing
      summary: Update a drawing's metadata.
      tags:
        - Drawings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Homepage wireframe v2
                description:
                  type:
                    - string
                    - 'null'
                  maxLength: 500
                  example: Updated after review
                tags:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                  maxItems: 20
                  example:
                    - wireframe
                    - homepage
                collection_id:
                  type: string
                  format: uuid
                  description: Move the drawing to a different collection.
                  example: 1b2c3d4e-5f6a-7890-bcde-f12345678901
      responses:
        '200':
          description: Updated drawing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drawing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteDrawing
      summary: Delete a drawing.
      tags:
        - Drawings
      responses:
        '204':
          description: Drawing deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces:
    get:
      operationId: listWorkspaces
      summary: List workspaces the current user belongs to.
      tags:
        - Workspaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createWorkspace
      summary: Create a new workspace.
      tags:
        - Workspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Design Team
                description:
                  type:
                    - string
                    - 'null'
                  maxLength: 500
                  example: All design-related drawings
      responses:
        '201':
          description: Workspace created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspaceId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getWorkspace
      summary: Fetch a workspace.
      tags:
        - Workspaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateWorkspace
      summary: Update a workspace name or description.
      tags:
        - Workspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Design Team
                description:
                  type:
                    - string
                    - 'null'
                  maxLength: 500
                  example: All design-related drawings
      responses:
        '200':
          description: Updated workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace and all its collections and drawings.
      description: Private workspaces cannot be deleted (403).
      tags:
        - Workspaces
      responses:
        '204':
          description: Workspace deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/members:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listWorkspaceMembers
      summary: List members of a workspace.
      tags:
        - Workspace Members
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addWorkspaceMember
      summary: Add a member to a workspace.
      tags:
        - Workspace Members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - role
              properties:
                user_id:
                  type: string
                  description: Keycloak subject (`sub`) of the user to add.
                  example: f:abc123:xyz
                role:
                  type: string
                  enum:
                    - admin
                    - member
                  example: member
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspaceId}/members/me:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: getMyMembership
      summary: Fetch the current user's membership in a workspace.
      tags:
        - Workspace Members
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: leaveWorkspace
      summary: Leave a workspace.
      description: The workspace owner cannot leave. Transfer ownership first.
      tags:
        - Workspace Members
      responses:
        '204':
          description: Left the workspace.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/MemberId'
    get:
      operationId: getWorkspaceMember
      summary: Fetch a workspace member.
      tags:
        - Workspace Members
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateWorkspaceMember
      summary: Update a workspace member's role.
      description: Cannot change the owner's role. Transfer ownership is not supported via this endpoint.
      tags:
        - Workspace Members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum:
                    - admin
                    - member
                  example: admin
      responses:
        '200':
          description: Updated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: removeWorkspaceMember
      summary: Remove a member from a workspace.
      description: The owner cannot be removed.
      tags:
        - Workspace Members
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspaceId}/collections:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      operationId: listCollections
      summary: List collections in a workspace.
      tags:
        - Collections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createCollection
      summary: Create a collection in a workspace.
      tags:
        - Collections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Sprint 12 Wireframes
                description:
                  type:
                    - string
                    - 'null'
                  maxLength: 500
                  example: All wireframes from sprint 12
      responses:
        '201':
          description: Collection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /workspaces/{workspaceId}/collections/{collectionId}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/CollectionId'
    get:
      operationId: getCollection
      summary: Fetch a collection.
      tags:
        - Collections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateCollection
      summary: Update a collection's name or description.
      tags:
        - Collections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: Sprint 12 Wireframes
                description:
                  type:
                    - string
                    - 'null'
                  maxLength: 500
                  example: All wireframes from sprint 12
      responses:
        '200':
          description: Updated collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteCollection
      summary: Delete a collection and all its drawings.
      tags:
        - Collections
      responses:
        '204':
          description: Collection deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          readOnly: true
          description: Keycloak subject (`sub`).
          example: f:abc123:xyz
        name:
          type: string
          readOnly: true
          example: John Doe
    Drawing:
      type: object
      required:
        - id
        - collection_id
        - title
        - created_by
        - created_at
        - updated_by
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        collection_id:
          type: string
          format: uuid
          example: 1b2c3d4e-5f6a-7890-bcde-f12345678901
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: Homepage wireframe
        description:
          type:
            - string
            - 'null'
          maxLength: 500
          example: Post-standup sketch
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 20
          example:
            - wireframe
            - homepage
        created_by:
          $ref: '#/components/schemas/User'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-05-20T14:32:00Z'
        updated_by:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
          readOnly: true
          description: Null if the drawing has never been updated.
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          readOnly: true
          description: Null if the drawing has never been updated.
          example: '2026-05-26T09:15:42Z'
    Workspace:
      type: object
      required:
        - id
        - name
        - is_private
        - created_by
        - created_at
        - updated_by
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 7a1c3e5d-2f4b-6890-abcd-ef1234567890
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Design Team
        description:
          type:
            - string
            - 'null'
          maxLength: 500
          example: All design-related drawings
        is_private:
          type: boolean
          readOnly: true
          description: True for the user's personal workspace. Private workspaces cannot be deleted and have no members.
          example: false
        created_by:
          $ref: '#/components/schemas/User'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-15T10:00:00Z'
        updated_by:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
          readOnly: true
          description: Null if the workspace has never been updated.
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          readOnly: true
          description: Null if the workspace has never been updated.
          example: '2026-05-20T14:32:00Z'
    WorkspaceMember:
      type: object
      required:
        - user
        - role
        - joined_at
      properties:
        user:
          $ref: '#/components/schemas/User'
        role:
          type: string
          enum:
            - owner
            - admin
            - member
          example: member
        joined_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-02-10T09:00:00Z'
    Collection:
      type: object
      required:
        - id
        - workspace_id
        - name
        - created_by
        - created_at
        - updated_by
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 1b2c3d4e-5f6a-7890-bcde-f12345678901
        workspace_id:
          type: string
          format: uuid
          readOnly: true
          example: 7a1c3e5d-2f4b-6890-abcd-ef1234567890
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Sprint 12 Wireframes
        description:
          type:
            - string
            - 'null'
          maxLength: 500
          example: All wireframes from sprint 12
        created_by:
          $ref: '#/components/schemas/User'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-03-01T08:00:00Z'
        updated_by:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
          readOnly: true
          description: Null if the collection has never been updated.
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          readOnly: true
          description: Null if the collection has never been updated.
          example: '2026-05-15T11:30:00Z'
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: Drawing 3fa85f64 not found.
        details:
          type: object
          additionalProperties: true
  parameters:
    DrawingId:
      name: drawingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Drawing identifier.
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Workspace identifier.
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Collection identifier.
    MemberId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: Keycloak subject (`sub`) of the workspace member.
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated user does not own this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with current resource state (e.g. user is already a member).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Request body is well-formed but contains invalid values.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

openapi: 3.2.0
info:
  title: Excalidraw Self Host Storage API
  version: 0.1.0
paths:
  /drawings/{id}:
    parameters:
      - $ref: '#/components/parameters/DrawingId'
    get:
      operationId: getDrawing
      summary: Fetch a drawing metadata.
      tags:
        - Drawings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drawing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          readOnly: true
          description: Keycloak subject (`sub`).
          example: f:abc123:xyz
        name:
          type: string
          readOnly: true
          example: John Doe
    Drawing:
      type: object
      required:
        - id
        - title
        - created_by
        - created_at
        - updated_by
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        title:
          type: string
          minLength: 1
          maxLength: 255
          example: Homepage wireframe
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Post-standup sketch
        tags:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 20
          example:
            - wireframe
            - homepage
        created_by:
          $ref: '#/components/schemas/User'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          example: '2026-05-20T14:32:00Z'
        updated_by:
          $ref: '#/components/schemas/User'
          readOnly: true
          nullable: true
          description: Null if the drawing has never been updated.
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Null if the drawing has never been updated.
          example: '2026-05-26T09:15:42Z'
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: Drawing 3fa85f64 not found.
        details:
          type: object
          additionalProperties: true
  parameters:
    DrawingId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Drawing identifier.
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated user does not own this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

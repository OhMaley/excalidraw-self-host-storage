services:
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-latest}
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${KC_DB_HOST:-keycloakdb}:${KC_DB_PORT:-5432}/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USERNAME:?KC_DB_USERNAME is required}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:-8080}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS:-false}
      KC_LOG_LEVEL: ${KC_LOG_LEVEL:-info}
      KC_METRICS_ENABLED: ${KC_METRICS_ENABLED:-true}
      KC_HEALTH_ENABLED: ${KC_HEALTH_ENABLED:-true}
    command: start-dev
    depends_on:
      keycloakdb:
        condition: service_healthy
    ports:
      - "${KC_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  keycloakdb:
    image: postgres:${POSTGRES_VERSION:-15}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
      POSTGRES_USER: ${KC_DB_USERNAME:?KC_DB_USERNAME is required}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME} -d ${KC_DB_NAME:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  appdb:
    image: postgres:${POSTGRES_VERSION:-15}
    container_name: appdb
    volumes:
      - appdb_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-excalidraw}
      POSTGRES_USER: ${APP_DB_USER:?APP_DB_USER is required}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    ports:
      - "${APP_DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER} -d ${APP_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrator:
    build:
      context: ../backend
      dockerfile: Dockerfile.migrator
    volumes:
      - ../backend/migrations:/migrations
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:?APP_DB_USER is required}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@appdb:5432/${APP_DB_NAME:-excalidraw}
    depends_on:
      appdb:
        condition: service_healthy
    restart: on-failure

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: backend
    environment:
      DATABASE_URL: postgres://${APP_DB_USER:?APP_DB_USER is required}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@appdb:5432/${APP_DB_NAME:-excalidraw}
      PORT: ${PORT:-3000}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?KEYCLOAK_ISSUER is required}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:?KEYCLOAK_JWKS_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      RUST_LOG: ${RUST_LOG:-info}
      STORAGE_LOCAL_PATH: /storage/drawings
    volumes:
      - ../backend:/app
      - backend_target:/app/target
      - ${DRAWINGS_PATH:-./.storage/drawings}:/storage/drawings
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      migrator:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  appdb_data:
  backend_target:

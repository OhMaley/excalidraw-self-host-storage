openapi: 3.0.3
info:
  title: My Frontend API
  version: 1.0.0
  description: REST API consumed by the frontend

servers:
  - url: https://api.example.com/v1

paths:
  /users/{id}:
    get:
      summary: Get a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
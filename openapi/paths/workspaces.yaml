list:
  get:
    operationId: listWorkspaces
    summary: List workspaces the current user belongs to.
    description: Returns all workspaces the authenticated user is a member of.
    tags: [Workspaces]
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/Workspace.yaml"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

  post:
    operationId: createWorkspace
    summary: Create a new workspace.
    description: Creates a new workspace. The authenticated user automatically becomes the workspace owner.
    tags: [Workspaces]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
                example: "Design Team"
              description:
                type:
                  - string
                  - "null"
                maxLength: 500
                example: "All design-related drawings"
    responses:
      "201":
        description: Workspace created.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/Workspace.yaml"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "422":
        $ref: "../components/responses.yaml#/UnprocessableEntity"

single:
  parameters:
    - $ref: "../components/parameters.yaml#/WorkspaceId"

  get:
    operationId: getWorkspace
    summary: Fetch a workspace.
    description: Returns metadata for a single workspace.
    tags: [Workspaces]
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas/Workspace.yaml"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"

  patch:
    operationId: updateWorkspace
    summary: Update a workspace.
    description: Partially updates a workspace's name or description. Omitted fields are left unchanged.
    tags: [Workspaces]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
                example: "Design Team"
              description:
                type:
                  - string
                  - "null"
                maxLength: 500
                example: "All design-related drawings"
    responses:
      "200":
        description: Updated workspace.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/Workspace.yaml"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "422":
        $ref: "../components/responses.yaml#/UnprocessableEntity"

  delete:
    operationId: deleteWorkspace
    summary: Delete a workspace and all its collections and drawings.
    description: Private workspaces cannot be deleted (403).
    tags: [Workspaces]
    responses:
      "204":
        description: Workspace deleted.
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
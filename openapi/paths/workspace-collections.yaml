list:
  parameters:
    - $ref: "../components/parameters.yaml#/WorkspaceId"

  get:
    operationId: listCollections
    summary: List collections in a workspace.
    description: Returns all collections in the specified workspace.
    tags: [Collections]
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/Collection.yaml"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"

  post:
    operationId: createCollection
    summary: Create a collection in a workspace.
    description: Creates a new collection in the specified workspace.
    tags: [Collections]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
                example: "Sprint 12 Wireframes"
              description:
                type:
                  - string
                  - "null"
                maxLength: 500
                example: "All wireframes from sprint 12"
    responses:
      "201":
        description: Collection created.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/Collection.yaml"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "422":
        $ref: "../components/responses.yaml#/UnprocessableEntity"

single:
  parameters:
    - $ref: "../components/parameters.yaml#/WorkspaceId"
    - $ref: "../components/parameters.yaml#/CollectionId"

  get:
    operationId: getCollection
    summary: Fetch a collection.
    description: Returns metadata for a single collection.
    tags: [Collections]
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "../components/schemas/Collection.yaml"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"

  patch:
    operationId: updateCollection
    summary: Update a collection's name or description.
    description: Partially updates a collection's name or description. Omitted fields are left unchanged.
    tags: [Collections]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
                example: "Sprint 12 Wireframes"
              description:
                type:
                  - string
                  - "null"
                maxLength: 500
                example: "All wireframes from sprint 12"
    responses:
      "200":
        description: Updated collection.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/Collection.yaml"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "422":
        $ref: "../components/responses.yaml#/UnprocessableEntity"

  delete:
    operationId: deleteCollection
    summary: Delete a collection and all its drawings.
    description: Permanently deletes the collection and all drawings it contains.
    tags: [Collections]
    responses:
      "204":
        description: Collection deleted.
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses.yaml#/Forbidden"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
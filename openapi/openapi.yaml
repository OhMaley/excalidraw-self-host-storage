openapi: 3.2.0
info:
  title: Excalidraw Self Host Storage API
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: "{protocol}://{host}:{port}"
    description: Excalidraw self-hosted server
    variables:
      protocol:
        default: http
        enum: [http, https]
      host:
        default: localhost
      port:
        default: "8080"

tags:
  - name: Workspaces
    description: Manage workspaces and their settings.
  - name: Workspace Members
    description: Manage membership and roles within a workspace.
  - name: Collections
    description: Manage collections of drawings within a workspace.
  - name: Drawings
    description: Manage individual drawings within a collection.

security:
  - keycloak: []

components:
  securitySchemes:
    keycloak:
      type: openIdConnect
      openIdConnectUrl: http://localhost:9090/realms/excalidraw/.well-known/openid-configuration

  schemas:
    User:
      $ref: "./components/schemas/User.yaml"
    Drawing:
      $ref: "./components/schemas/Drawing.yaml"
    ExcalidrawFile:
      $ref: "./components/schemas/ExcalidrawFile.yaml"
    Workspace:
      $ref: "./components/schemas/Workspace.yaml"
    WorkspaceMember:
      $ref: "./components/schemas/WorkspaceMember.yaml"
    Collection:
      $ref: "./components/schemas/Collection.yaml"

  parameters:
    DrawingId:
      $ref: "./components/parameters.yaml#/DrawingId"
    WorkspaceId:
      $ref: "./components/parameters.yaml#/WorkspaceId"
    CollectionId:
      $ref: "./components/parameters.yaml#/CollectionId"
    MemberId:
      $ref: "./components/parameters.yaml#/MemberId"

  responses:
    Unauthorized:
      $ref: "./components/responses.yaml#/Unauthorized"
    Forbidden:
      $ref: "./components/responses.yaml#/Forbidden"
    NotFound:
      $ref: "./components/responses.yaml#/NotFound"
    Conflict:
      $ref: "./components/responses.yaml#/Conflict"
    UnprocessableEntity:
      $ref: "./components/responses.yaml#/UnprocessableEntity"

paths:
  /workspaces/{workspaceId}/collections/{collectionId}/drawings:
    $ref: "./paths/drawings.yaml#/list"
  /workspaces/{workspaceId}/collections/{collectionId}/drawings/{drawingId}:
    $ref: "./paths/drawings.yaml#/single"
  /workspaces/{workspaceId}/collections/{collectionId}/drawings/{drawingId}/content:
    $ref: "./paths/drawing_content.yaml#/content"

  /workspaces:
    $ref: "./paths/workspaces.yaml#/list"
  /workspaces/{workspaceId}:
    $ref: "./paths/workspaces.yaml#/single"

  /workspaces/{workspaceId}/members:
    $ref: "./paths/workspace-members.yaml#/list"
  /workspaces/{workspaceId}/members/me:
    $ref: "./paths/workspace-members.yaml#/me"
  /workspaces/{workspaceId}/members/{userId}:
    $ref: "./paths/workspace-members.yaml#/single"

  /workspaces/{workspaceId}/collections:
    $ref: "./paths/workspace-collections.yaml#/list"
  /workspaces/{workspaceId}/collections/{collectionId}:
    $ref: "./paths/workspace-collections.yaml#/single"

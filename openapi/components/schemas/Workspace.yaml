type: object
required:
  - id
  - name
  - is_private
  - created_by
  - created_at
  - updated_by
  - updated_at
properties:
  id:
    type: string
    format: uuid
    readOnly: true
    example: "7a1c3e5d-2f4b-6890-abcd-ef1234567890"

  name:
    type: string
    minLength: 1
    maxLength: 100
    example: "Design Team"

  description:
    type: string
    maxLength: 500
    nullable: true
    example: "All design-related drawings"

  is_private:
    type: boolean
    readOnly: true
    description: True for the user's personal workspace. Private workspaces cannot be deleted and have no members.
    example: false

  created_by:
    $ref: "./User.yaml"
    readOnly: true

  created_at:
    type: string
    format: date-time
    readOnly: true
    example: "2026-01-15T10:00:00Z"

  updated_by:
    $ref: "./User.yaml"
    readOnly: true
    nullable: true
    description: Null if the workspace has never been updated.

  updated_at:
    type: string
    format: date-time
    readOnly: true
    nullable: true
    description: Null if the workspace has never been updated.
    example: "2026-05-20T14:32:00Z"

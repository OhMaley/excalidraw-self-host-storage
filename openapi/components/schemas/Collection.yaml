type: object
required:
  - id
  - workspace_id
  - name
  - created_by
  - created_at
  - updated_by
  - updated_at
properties:
  id:
    type: string
    format: uuid
    readOnly: true
    example: "1b2c3d4e-5f6a-7890-bcde-f12345678901"

  workspace_id:
    type: string
    format: uuid
    readOnly: true
    example: "7a1c3e5d-2f4b-6890-abcd-ef1234567890"

  name:
    type: string
    minLength: 1
    maxLength: 100
    example: "Sprint 12 Wireframes"

  description:
    type:
      - string
      - "null"
    maxLength: 500
    example: "All wireframes from sprint 12"

  created_by:
    $ref: "./User.yaml"
    readOnly: true

  created_at:
    type: string
    format: date-time
    readOnly: true
    example: "2026-03-01T08:00:00Z"

  updated_by:
    oneOf:
      - $ref: "./User.yaml"
      - type: "null"
    readOnly: true
    description: Null if the collection has never been updated.

  updated_at:
    type:
      - string
      - "null"
    format: date-time
    readOnly: true
    description: Null if the collection has never been updated.
    example: "2026-05-15T11:30:00Z"

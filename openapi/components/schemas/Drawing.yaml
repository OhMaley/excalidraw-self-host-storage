type: object
required:
  - id
  - collection_id
  - title
  - created_by
  - created_at
  - updated_by
  - updated_at
properties:
  id:
    type: string
    format: uuid
    readOnly: true
    example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

  collection_id:
    type: string
    format: uuid
    example: "1b2c3d4e-5f6a-7890-bcde-f12345678901"

  title:
    type: string
    minLength: 1
    maxLength: 100
    example: "Homepage wireframe"

  description:
    type:
      - string
      - "null"
    maxLength: 500
    example: "Post-standup sketch"

  tags:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 64
    maxItems: 20
    example: ["wireframe", "homepage"]

  created_by:
    $ref: "./User.yaml"
    readOnly: true

  created_at:
    type: string
    format: date-time
    readOnly: true
    example: "2026-05-20T14:32:00Z"

  updated_by:
    oneOf:
      - $ref: "./User.yaml"
      - type: "null"
    readOnly: true
    description: Null if the drawing has never been updated.

  updated_at:
    type:
      - string
      - "null"
    format: date-time
    readOnly: true
    description: Null if the drawing has never been updated.
    example: "2026-05-26T09:15:42Z"

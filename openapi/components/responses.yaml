Unauthorized:
  description: Missing or invalid bearer token.
  content:
    application/json:
      schema:
        $ref: "./schemas/Error.yaml"

Forbidden:
  description: Authenticated user does not own this resource.
  content:
    application/json:
      schema:
        $ref: "./schemas/Error.yaml"

NotFound:
  description: Resource not found.
  content:
    application/json:
      schema:
        $ref: "./schemas/Error.yaml"

Conflict:
  description: Request conflicts with current resource state (e.g. user is already a member).
  content:
    application/json:
      schema:
        $ref: "./schemas/Error.yaml"

UnprocessableEntity:
  description: Request body is well-formed but contains invalid values.
  content:
    application/json:
      schema:
        $ref: "./schemas/Error.yaml"

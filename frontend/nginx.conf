server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Vite fingerprints filenames in /assets, safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always revalidate so a redeploy's new bundle is picked
    # up immediately instead of being served stale from a client cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

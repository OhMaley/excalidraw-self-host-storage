ci:
    collect:
        startServerCommand: npx vite preview --port 4173
        startServerReadyPattern: "Local:"
        url:
            # Add any new public route here (loginRequired: false in routes.tsx).
            # Protected routes redirect to Keycloak in CI and cannot be audited.

            # Public — renders Excalidraw canvas in unauthenticated mode
            - http://localhost:4173/draw

            # Protected — RequireAuth intercepts, Keycloak fails → renders AuthError
            - http://localhost:4173/dashboard
        numberOfRuns: 1
        settings:
            # Audits that are false negatives in a local HTTP build environment
            skipAudits:
                - is-on-https
                - uses-http2
                - redirects-http

    assert:
        assertions:
            # Excalidraw is a heavy library — keep this as warn until a baseline is established
            categories:performance:
                - warn
                - { minScore: 0.5 }
            # Accessibility is non-negotiable
            categories:accessibility:
                - error
                - { minScore: 0.9 }
            categories:best-practices:
                - warn
                - { minScore: 0.8 }
            # SEO is secondary for an authenticated app
            categories:seo:
                - warn
                - { minScore: 0.7 }

    upload:
        target: temporary-public-storage

name: OpenAPI — Quality

on:
  push:
    branches: [main]
    paths:
      - "openapi/**"
      - "redocly.yaml"
      - ".github/workflows/openapi-quality.yml"
  pull_request:
    paths:
      - "openapi/**"
      - "redocly.yaml"
      - ".github/workflows/openapi-quality.yml"

jobs:
  lint:
    name: Redocly lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint OpenAPI spec
        run: npx --yes @redocly/cli@2 lint --config redocly.yaml

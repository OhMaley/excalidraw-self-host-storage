name: Backend — Tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: backend

env:
  DATABASE_URL: postgres://test:test@localhost:5432/excalidraw
  SQLX_OFFLINE: "true"

jobs:
  test:
    name: Cargo tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: excalidraw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: backend

      - name: Cache sqlx-cli
        uses: actions/cache@v4
        id: cache-sqlx
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}

      - name: Install sqlx-cli
        if: steps.cache-sqlx.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Run migrations
        run: sqlx migrate run

      - name: Run tests
        run: cargo test --all-targets

      - name: Clippy (lint findings)
        id: clippy
        run: |
          output=$(cargo clippy --all-targets -- -W clippy::all 2>&1) || true
          echo "$output"
          if echo "$output" | grep -qE "^(warning|error)"; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
            echo "$output" > /tmp/clippy-output.txt
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Warn on push when clippy reports findings
        if: steps.clippy.outputs.has_findings == 'true' && github.event_name != 'pull_request'
        run: echo "::warning::Clippy reported findings. Run 'cargo clippy --all-targets' locally for details."

      - name: Comment clippy findings on PR
        if: steps.clippy.outputs.has_findings == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "<!-- clippy-findings -->"
            echo "## 🧹 Clippy findings"
            echo ""
            echo '```'
            cat /tmp/clippy-output.txt
            echo '```'
            echo ""
            echo "Run \`cargo clippy --all-targets\` locally to review."
          } > /tmp/clippy-comment.txt

          existingId=$(gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '[.[] | select(.body | contains("<!-- clippy-findings -->")) | .id][0] // empty')

          if [ -n "$existingId" ]; then
            gh api --method PATCH \
              "repos/${{ github.repository }}/issues/comments/$existingId" \
              --field body=@/tmp/clippy-comment.txt
          else
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --body-file /tmp/clippy-comment.txt
          fi

          echo "::warning::Clippy reported findings. See PR comment for details."

      - name: Cache cargo-audit
        uses: actions/cache@v4
        id: cache-audit
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit

      - name: Audit dependencies
        run: cargo audit

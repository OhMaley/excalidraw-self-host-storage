name: Frontend — Quality

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-quality.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # -- Static analysis --

      - name: TypeScript type check
        run: npm run type-check

      - name: ESLint (incl. SonarJS — complexity, smells, duplication)
        run: npm run lint

      # -- Code duplication --

      - name: Code duplication (jscpd, fails above 5%)
        run: npm run jscpd

      # -- Dead code & dependency health --

      - name: Dead code & unused exports/deps (Knip)
        run: npm run knip

      # -- Dependency security & freshness --

      - name: Vulnerability audit (npm audit, moderate+)
        run: npm audit --audit-level=moderate

      - name: Outdated dependencies (npm-check-updates)
        run: npx --yes npm-check-updates
        continue-on-error: true
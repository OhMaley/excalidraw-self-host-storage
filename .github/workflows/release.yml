name: Release — Build & Deploy

# Tag push (vX.Y.Z)  -> tests -> images tagged vX.Y.Z + sha-<sha> -> deploy
# Manual run         -> tests -> images tagged sha-<sha>          -> deploy
# The deploy job waits for approval on the "production" environment.
# To redeploy or roll back an existing version without rebuilding, run
# deploy.yml manually instead.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    uses: ./.github/workflows/backend-tests.yml
    permissions:
      contents: read
      pull-requests: write

  frontend-quality:
    uses: ./.github/workflows/frontend-quality.yml
    permissions:
      contents: read
      pull-requests: write

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      image_prefix: ${{ steps.v.outputs.image_prefix }}
    steps:
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          else
            version="sha-$SHA"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # GHCR image names must be lowercase.
          echo "image_prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  build:
    name: Build ${{ matrix.image }}
    needs: [backend-tests, frontend-quality, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: backend
            context: backend
            file: backend/Dockerfile
          - image: migrator
            context: backend
            file: backend/Dockerfile.migrator
          - image: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.version.outputs.image_prefix }}/${{ matrix.image }}
          # No `latest`: production always pins an explicit version.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: [build, version]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit